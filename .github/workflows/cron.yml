name: Scheduled Cron Jobs

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-crons:
    runs-on: ubuntu-latest
    steps:
      - name: Flush Visitor Tracking Buffer
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_URL }}/api/cron/flush-tracking"

      - name: Flush Web Vitals Buffer
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_URL }}/api/cron/flush-vitals"

      - name: Flush API Metrics Buffer
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_URL }}/api/cron/flush-metrics"

      - name: Clean Stale Analytics Data
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_URL }}/api/cron/clean-analytics"